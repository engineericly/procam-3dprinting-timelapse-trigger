###############################################################################
#  Camera trigger timelapse for Klipper
#
#  The toolhead taps a microswitch at each layer change. The switch is wired to
#  an ESP32 which fires the FX30 over Wi-Fi. Klipper never talks to the camera,
#  it just presses a button with the printhead.
#
#  Sequence, following the order you tested:
#      1. travel to the APPROACH point                (fast, diagonal)
#      2. creep onto the switch                       -> this fires the camera
#      3. brief dwell so the contact definitely closes
#      4. back off to the REST point                  -> head out of frame
#      5. hold still while the shutter actually fires
#      6. return to the print and carry on
#
#  Step 4 before step 5 is the important part: the shot must be taken with the
#  head parked out of shot and the machine still. That means the ESP32 has to
#  WAIT after the switch closes rather than firing instantly - set
#  OC_TRIGGER_DELAY_MS in the firmware to about press_dwell + 400 ms.
#
#  INSTALL
#    1. Save next to printer.cfg and add:   [include timelapse_trigger.cfg]
#    2. Slicer > Printer Settings > Custom G-code > After layer change:
#           TIMELAPSE_TAKE_FRAME
#    3. Run TIMELAPSE_TEST from the console first and watch the head hit the
#       lever before committing a real print to it.
#
#  BEFORE FIRST RUN
#    - The coordinates below are EXAMPLES from another machine. Re-measure them
#      on yours. TIMELAPSE_TAKE_FRAME checks them against your real
#      position_min/max and disables itself rather than aborting a long print,
#      but it cannot know what is physically mounted in the way.
#    - Jog the head there by hand, slowly, with Z raised, and watch it before
#      you ever let a macro do it at speed.
#
#  ON A TOOLCHANGER (Snapmaker U1 and similar)
#    - Tool docks usually sit BEYOND the bed in Y. On the U1 the bed is 270 but
#      Y travels to 335, and the head crosses that region on every toolchange.
#      Mount the switch at the FRONT (low Y), well away from the docks.
#    - Tool offsets mean one G-code coordinate puts a DIFFERENT nozzle at that
#      point for each tool. If the switch is struck by the toolhead body rather
#      than the nozzle, the contact point moves between tools. Test the trigger
#      with every tool you intend to print with, not just T0.
###############################################################################

[gcode_macro _TL_CONF]
# --- positions, from your tested sequence ----------------------------------
variable_approach_x:    250.0    # fast diagonal travel lands here
variable_approach_y:    265.0
variable_trigger_x:     262.8    # presses the lever - fires the camera
variable_trigger_y:     265.0
variable_rest_x:        255.0    # backs off to here, clear of the switch
variable_rest_y:        265.0    # and out of the camera's frame

# --- speeds ----------------------------------------------------------------
variable_travel_speed:  18000    # mm/min (F18000 = 300 mm/s)
variable_press_speed:    6000    # mm/min, slower onto the lever
variable_return_speed:  18000    # mm/min

# --- timing ----------------------------------------------------------------
variable_press_dwell:     100    # ms held against the switch
variable_shot_dwell:     2000    # ms parked at rest while the shot is taken.
                                 # Must cover the ESP32's trigger delay plus
                                 # its shutter time, with margin.

# --- motion --------------------------------------------------------------
variable_z_hop:           0.6    # mm clear of the print during the trip
variable_retract:         0.8    # mm, stops oozing on the way there and back
variable_retract_speed:   2400   # mm/min

# --- behaviour -------------------------------------------------------------
variable_enabled:            1   # 0 disables without touching the slicer
variable_skip_layers:        1   # skip the first N layers
variable_frame:              0   # frame counter
gcode:
    # configuration holder, nothing to execute


[gcode_macro TIMELAPSE_TAKE_FRAME]
description: Tap the camera trigger switch for one timelapse frame
gcode:
    {% set c = printer["gcode_macro _TL_CONF"] %}

    # Read the machine's real limits rather than trusting the numbers above.
    # A coordinate outside them would abort the whole print with "Move out of
    # range" - losing 20 hours of work to a typo. Skip the frame and warn.
    {% set xmin = printer.configfile.settings.stepper_x.position_min|float %}
    {% set xmax = printer.configfile.settings.stepper_x.position_max|float %}
    {% set ymin = printer.configfile.settings.stepper_y.position_min|float %}
    {% set ymax = printer.configfile.settings.stepper_y.position_max|float %}
    {% set pts  = [(c.approach_x|float, c.approach_y|float),
                   (c.trigger_x|float,  c.trigger_y|float),
                   (c.rest_x|float,     c.rest_y|float)] %}
    {% set ns = namespace(bad=false) %}
    {% for px, py in pts %}
        {% if px < xmin or px > xmax or py < ymin or py > ymax %}
            {% set ns.bad = true %}
        {% endif %}
    {% endfor %}

    {% if c.enabled|int == 0 %}
        # disabled
    {% elif ns.bad %}
        {action_respond_info(
            "TIMELAPSE: coordinates outside machine limits X[%.1f..%.1f] Y[%.1f..%.1f] - frames disabled, print continues"
            % (xmin, xmax, ymin, ymax))}
        SET_GCODE_VARIABLE MACRO=_TL_CONF VARIABLE=enabled VALUE=0
    {% elif printer.toolhead.homed_axes != "xyz" %}
        {action_respond_info("TIMELAPSE: not homed, frame skipped")}
    {% else %}
        {% set layer = printer.print_stats.info.current_layer %}
        {% if layer is not none and layer|int <= c.skip_layers|int %}
            # still in the opening layers, skip
        {% else %}
            SAVE_GCODE_STATE NAME=_tl_state

            M83
            {% if c.retract|float > 0 %}
                G1 E-{c.retract|float} F{c.retract_speed|int}
            {% endif %}
            {% if c.z_hop|float > 0 %}
                G91
                G1 Z{c.z_hop|float} F1200
                G90
            {% endif %}

            G90
            G1 X{c.approach_x|float} Y{c.approach_y|float} F{c.travel_speed|int}

            # onto the switch - the camera is triggered on this contact
            G1 X{c.trigger_x|float} Y{c.trigger_y|float} F{c.press_speed|int}
            M400
            G4 P{c.press_dwell|int}

            # off the switch and out of frame, THEN hold still for the photo
            G1 X{c.rest_x|float} Y{c.rest_y|float} F{c.press_speed|int}
            M400
            G4 P{c.shot_dwell|int}

            {% if c.z_hop|float > 0 %}
                G91
                G1 Z-{c.z_hop|float} F1200
                G90
            {% endif %}
            {% if c.retract|float > 0 %}
                G1 E{c.retract|float} F{c.retract_speed|int}
            {% endif %}

            RESTORE_GCODE_STATE NAME=_tl_state MOVE=1 MOVE_SPEED={(c.return_speed|int / 60)|int}

            SET_GCODE_VARIABLE MACRO=_TL_CONF VARIABLE=frame VALUE={c.frame|int + 1}
        {% endif %}
    {% endif %}


[gcode_macro TIMELAPSE_TEST]
description: Fire one frame now, for aiming the switch before a real print
gcode:
    {% set c = printer["gcode_macro _TL_CONF"] %}
    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_respond_info("TIMELAPSE_TEST: home first (G28)")}
    {% else %}
        {action_respond_info("TIMELAPSE_TEST: limits X[%.1f..%.1f] Y[%.1f..%.1f]"
            % (printer.configfile.settings.stepper_x.position_min|float,
               printer.configfile.settings.stepper_x.position_max|float,
               printer.configfile.settings.stepper_y.position_min|float,
               printer.configfile.settings.stepper_y.position_max|float))}
        {action_respond_info("TIMELAPSE_TEST: approach %.1f,%.1f -> trigger %.1f,%.1f -> rest %.1f,%.1f"
            % (c.approach_x|float, c.approach_y|float,
               c.trigger_x|float,  c.trigger_y|float,
               c.rest_x|float,     c.rest_y|float))}
        SAVE_GCODE_STATE NAME=_tl_test
        G90
        G1 X{c.approach_x|float} Y{c.approach_y|float} F{c.travel_speed|int}
        G1 X{c.trigger_x|float} Y{c.trigger_y|float} F{c.press_speed|int}
        M400
        G4 P{c.press_dwell|int}
        G1 X{c.rest_x|float} Y{c.rest_y|float} F{c.press_speed|int}
        M400
        G4 P{c.shot_dwell|int}
        RESTORE_GCODE_STATE NAME=_tl_test MOVE=1 MOVE_SPEED={(c.return_speed|int / 60)|int}
    {% endif %}


[gcode_macro TIMELAPSE_ON]
description: Enable timelapse frames
gcode:
    SET_GCODE_VARIABLE MACRO=_TL_CONF VARIABLE=enabled VALUE=1
    {action_respond_info("TIMELAPSE: enabled")}


[gcode_macro TIMELAPSE_OFF]
description: Disable timelapse frames without editing the slicer
gcode:
    SET_GCODE_VARIABLE MACRO=_TL_CONF VARIABLE=enabled VALUE=0
    {action_respond_info("TIMELAPSE: disabled")}


[gcode_macro TIMELAPSE_RESET]
description: Zero the frame counter, run before each print
gcode:
    SET_GCODE_VARIABLE MACRO=_TL_CONF VARIABLE=frame VALUE=0
    {action_respond_info("TIMELAPSE: frame counter reset")}


[gcode_macro TIMELAPSE_STATUS]
description: Report timelapse settings and frame count
gcode:
    {% set c = printer["gcode_macro _TL_CONF"] %}
    {action_respond_info("TIMELAPSE %s | frames: %d | trigger %.1f,%.1f | rest %.1f,%.1f | shot dwell %d ms"
        % ("ON" if c.enabled|int else "OFF", c.frame|int,
           c.trigger_x|float, c.trigger_y|float,
           c.rest_x|float, c.rest_y|float, c.shot_dwell|int))}
