; ===========================================================================
; PROCAM_TRIGGER_SHOT - the whole camera-trigger sequence, in one macro
;
; (named FX30_TRIGGER_SHOT until Klipper's parser turned out to choke on
; letters-immediately-followed-by-digits in a macro name - "FX30..." was
; getting truncated to "FX30" and misread as an attempted G-code command,
; so the macro never fired. PROCAM_TRIGGER_SHOT avoids that entirely.)
;
; Replaces everything that used to live in Orca's "Timelapse G-code" custom
; box AND the separate purge macro - it's all here now. Save position,
; lift clear, park out of frame, tell the ESP32 (over Moonraker) to fire
; the shutter, dwell, trace the small purge oval, return to the resume
; point. The Orca box itself now only needs ONE line:
;
;     PROCAM_TRIGGER_SHOT
;
; Every knob below can be tuned from Fluidd's console with
; SET_GCODE_VARIABLE, or by editing this file and restarting Klipper -
; NOT by re-slicing the model.
;
; SETTINGS:
;   park_x / park_y   where the nozzle parks for the photo (default:
;                      back-right corner)
;   z_hop             how far to lift before crossing to the park spot
;   trigger_token      must match TRIGGER_TOKEN in the ESP32 firmware
;   dwell_ms           how long to hold still after triggering, in ms
;   purge_z            tracks the purge pad's current height across calls -
;                       don't hand-edit this one, the macro manages it
;   layer_height        must match your print's layer height (0.2mm here)
;   pad_x / pad_y        purge oval center - must be clear of both the
;                         object and the park/photo position
;   retract_len          must match your filament profile's
;                         retraction_length
;   purge_amount          extra filament purged per call (the actual
;                          purge volume, beyond just un-retracting)
;   purge_max_z            height cap in mm - a thin single-outline oval
;                           will topple if it keeps growing on a tall
;                           print, so past this height it stops climbing
;                           and just keeps refreshing its flat top instead
; ===========================================================================

[gcode_macro PROCAM_TRIGGER_SHOT]
variable_park_x: 255.0
variable_park_y: 255.0
variable_z_hop: 2.0
variable_trigger_token: "PROCAM_TRIGGER"
variable_dwell_ms: 1200
variable_purge_z: 0.0
variable_layer_height: 0.2
variable_pad_x: 235.0
variable_pad_y: 250.0
variable_retract_len: 1.5
variable_purge_amount: 2.0
variable_purge_max_z: 15.0
gcode:
    {% set svars = printer["gcode_macro PROCAM_TRIGGER_SHOT"] %}

    SAVE_GCODE_STATE NAME=procam

    G91
    G1 Z{svars.z_hop} F1200
    G90
    G1 X{svars.park_x} Y{svars.park_y} F18000
    M400

    RESPOND TYPE=command MSG="{svars.trigger_token}"

    G4 P{svars.dwell_ms}

    ; ---------------- purge oval (was FX30_PURGE) ----------------
    {% set target_z = svars.purge_z + svars.layer_height %}
    {% set new_z = [target_z, svars.purge_max_z] | min %}
    SET_GCODE_VARIABLE MACRO=PROCAM_TRIGGER_SHOT VARIABLE=purge_z VALUE={new_z}

    G90
    G1 Z{new_z + 1} F1200
    G1 X{svars.pad_x + 6} Y{svars.pad_y} F18000
    G1 Z{new_z} F1200

    M83
    G1 E{svars.retract_len} F1800

    G91
    G1 X-0.457 Y1.531 E0.1013 F400
    G1 X-1.301 Y1.298 E0.1166 F400
    G1 X-1.947 Y0.867 E0.1352 F400
    G1 X-2.296 Y0.304 E0.1469 F400
    G1 X-2.296 Y-0.304 E0.1469 F400
    G1 X-1.947 Y-0.867 E0.1352 F400
    G1 X-1.301 Y-1.298 E0.1166 F400
    G1 X-0.457 Y-1.531 E0.1013 F400
    G1 X0.457 Y-1.531 E0.1013 F400
    G1 X1.301 Y-1.298 E0.1166 F400
    G1 X1.947 Y-0.867 E0.1352 F400
    G1 X2.296 Y-0.304 E0.1469 F400
    G1 X2.296 Y0.304 E0.1469 F400
    G1 X1.947 Y0.867 E0.1352 F400
    G1 X1.301 Y1.298 E0.1166 F400
    G1 X0.457 Y1.531 E0.1013 F400
    ; total purge extruded above: 2.0mm, matches purge_amount default -
    ; if you change purge_amount, rescale these E values by the same ratio

    G1 X0.5 Y0.5 F3000
    G90

    M83
    G1 E-{svars.retract_len + svars.purge_amount} F1800

    G1 Z{new_z + 2} F1200
    ; -------------- end purge oval --------------

    RESTORE_GCODE_STATE NAME=procam MOVE=1 MOVE_SPEED=300
