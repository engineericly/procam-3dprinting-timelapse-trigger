; ===========================================================================
; FX30_PURGE - small 12x8mm oval purge pad for the camera-trigger box
;
; Called once per layer from the Timelapse G-code box, right after the
; camera dwell and before RESTORE_GCODE_STATE. Traces a 16-segment oval
; (12mm on X, 8mm on Y) while pushing out a small purge volume, so any
; ooze picked up during the ~1.2s stationary dwell lands here instead of
; on the real print - and only AFTER this purge does the toolhead ever
; go back to the object's resume point.
;
; Height tracking: this pad has to grow with the print (0.2mm per call,
; same as this print's layer height) or the next layer's pass would
; collide with what it printed last time. It's capped at 15mm tall
; (~75 layers) because a thin single-outline oval keeps growing forever
; otherwise and will topple on a tall print - past the cap it keeps
; purging onto the same flat top instead of climbing further. Raise
; purge_max_z if you want it taller and it proves stable, or ask for a
; filled (not just outline) version if 12x8mm at height feels flimsy.
;
; SETTINGS - adjust these to match your printer/profile:
;   layer_height    must match your print's layer height (0.2mm here)
;   pad_x / pad_y   oval center - must be clear of BOTH the real object
;                   and the park/photo position (default here: 20mm to
;                   the left of the back-right park corner)
;   retract_len     must match your filament profile's retraction_length
;   purge_amount    extra filament purged per call, beyond just
;                   un-retracting (the actual purge volume)
;   purge_max_z     height cap in mm - see note above
; ===========================================================================

[gcode_macro FX30_PURGE]
variable_purge_z: 0.0
variable_layer_height: 0.2
variable_pad_x: 235.0
variable_pad_y: 250.0
variable_retract_len: 1.5
variable_purge_amount: 2.0
variable_purge_max_z: 15.0
gcode:
    {% set svars = printer["gcode_macro FX30_PURGE"] %}
    {% set target_z = svars.purge_z + svars.layer_height %}
    {% set new_z = [target_z, svars.purge_max_z] | min %}
    SET_GCODE_VARIABLE MACRO=FX30_PURGE VARIABLE=purge_z VALUE={new_z}

    G90
    G1 Z{new_z + 1} F1200                            ; travel height, 1mm clear of this layer's pad
    G1 X{svars.pad_x + 6} Y{svars.pad_y} F18000       ; move above the oval's start point
    G1 Z{new_z} F1200                                 ; plunge down to this layer's pad height

    M83                                               ; relative extrusion
    G1 E{svars.retract_len} F1800                     ; un-retract - ready to extrude

    G91                                                ; relative XY for the oval trace itself
    G1 X-0.457 Y1.531 E0.1013 F400
    G1 X-1.301 Y1.298 E0.1166 F400
    G1 X-1.947 Y0.867 E0.1352 F400
    G1 X-2.296 Y0.304 E0.1469 F400
    G1 X-2.296 Y-0.304 E0.1469 F400
    G1 X-1.947 Y-0.867 E0.1352 F400
    G1 X-1.301 Y-1.298 E0.1166 F400
    G1 X-0.457 Y-1.531 E0.1013 F400
    G1 X0.457 Y-1.531 E0.1013 F400
    G1 X1.301 Y-1.298 E0.1166 F400
    G1 X1.947 Y-0.867 E0.1352 F400
    G1 X2.296 Y-0.304 E0.1469 F400
    G1 X2.296 Y0.304 E0.1469 F400
    G1 X1.947 Y0.867 E0.1352 F400
    G1 X1.301 Y1.298 E0.1166 F400
    G1 X0.457 Y1.531 E0.1013 F400
    ; total purge extruded above: 2.0mm, matches purge_amount default -
    ; if you change purge_amount, rescale these E values by the same ratio

    G1 X0.5 Y0.5 F3000                                ; short non-extruding wipe, away from the stop point
    G90

    M83
    G1 E-{svars.retract_len + svars.purge_amount} F1800
    ; retracts back by EVERYTHING pushed out above (un-retract + purge),
    ; landing at the exact same retracted baseline this macro started at -
    ; so RESTORE_GCODE_STATE and Orca's own auto-deretract afterward stay
    ; correctly balanced, same as the rest of the trigger box already is

    G1 Z{new_z + 2} F1200                             ; lift clear before handing back control
