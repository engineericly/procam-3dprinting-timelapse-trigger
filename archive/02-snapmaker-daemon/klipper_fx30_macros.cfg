# klipper_fx30_macros.cfg
#
# Networked FX30 trigger - replaces the physical-switch travel dance with a
# call to fx30_daemon.py (which must already be running - see
# fx30-trigger.service). Include this file from your printer.cfg:
#
#   [include klipper_fx30_macros.cfg]
#
# REQUIRES the "gcode_shell_command" Klipper extra. This is NOT part of
# stock Klipper - it's a well-known community add-on (the same one Mainsail
# / Moonraker's timelapse plugin relies on to call external programs from a
# macro). Check whether your Klipper install already has it:
#
#   ls ~/klipper/klippy/extras/gcode_shell_command.py
#
# If that file doesn't exist, KIAUH's Moonraker/webcam or timelapse install
# option adds it, or you can drop it in manually from the moonraker-timelapse
# project and restart the Klipper service. I can't confirm from here whether
# Snapmaker's Klipper build already ships it - check the file above first.

[gcode_shell_command FX30_FIRE_CMD]
# Adjust this path to wherever you actually installed fx30_fire.py.
command: python3 /opt/fx30-trigger/fx30_fire.py FIRE
timeout: 3.0
verbose_error: True

[gcode_macro FX30_TRIGGER]
description: Fire the FX30 over the network via the always-on trigger daemon - no travel, no physical switch.
gcode:
    RUN_SHELL_COMMAND CMD=FX30_FIRE_CMD

# Optional: a status check you can run by hand from the console (Mainsail/
# Fluidd "Console" tab) to confirm the daemon sees the camera, without
# firing a shot - handy for troubleshooting mid-print or before a print.
[gcode_shell_command FX30_STATUS_CMD]
command: python3 /opt/fx30-trigger/fx30_fire.py STATUS
timeout: 3.0
verbose_error: True

[gcode_macro FX30_STATUS]
description: Report whether the FX30 trigger daemon currently has a live connection to the camera.
gcode:
    RUN_SHELL_COMMAND CMD=FX30_STATUS_CMD
