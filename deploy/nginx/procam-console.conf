# PROCAM Trigger Console - plain nginx on a LAN machine (e.g. the Ubuntu VM).
#
# HTTP on purpose. The page calls Moonraker at http://<printer>, and a browser
# blocks an HTTPS page from reaching a plain-HTTP one. Do not put a certificate
# on this host or the live controls stop working.
#
# Install to /etc/nginx/sites-available/procam-console.conf and symlink it into
# sites-enabled. See README.md in this folder.

server {
    listen 8088;
    listen [::]:8088;

    server_name _;

    root /srv/procam-console/console;
    index index.html;
    charset utf-8;

    # The console is one file that changes when you git pull. Without this,
    # the browser serves a stale copy until a hard refresh.
    add_header Cache-Control "no-cache, must-revalidate";

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/procam-console.access.log;
    error_log  /var/log/nginx/procam-console.error.log;
}
